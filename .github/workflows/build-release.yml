name: Build and release Cheat Engine

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, for example v7.5.0-1'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      LAZARUS_DIR: C:\lazarus
      PROJECT_DIR: Cheat Engine
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lazarus 2.2.2 and cross compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%202.2.2'
          $native = "$base/lazarus-2.2.2-fpc-3.2.2-win64.exe/download"
          $cross = "$base/lazarus-2.2.2-fpc-3.2.2-cross-i386-win32-win64.exe/download"
          curl.exe -fL --retry 3 --output "$env:TEMP\lazarus.exe" $native
          curl.exe -fL --retry 3 --output "$env:TEMP\lazarus-cross-i386.exe" $cross
          Start-Process "$env:TEMP\lazarus.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Process "$env:TEMP\lazarus-cross-i386.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path "$env:LAZARUS_DIR\lazbuild.exe")) {
            throw 'lazbuild.exe was not installed at C:\lazarus'
          }

      - name: Build 32-bit and 64-bit binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:LAZARUS_DIR\lazbuild.exe" "$env:PROJECT_DIR\cheatengine.lpi" --build-mode='Release 32-Bit'
          & "$env:LAZARUS_DIR\lazbuild.exe" "$env:PROJECT_DIR\cheatengine.lpi" --build-mode='Release 64-Bit'

      - name: Prepare release tag
        if: inputs.release_tag != '' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = "refs/tags/$env:RELEASE_TAG"
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/$ref" 2>$null
          if (-not $existing) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref=$ref -f sha=$env:GITHUB_SHA | Out-Null
          }

      - name: Prepare self-extracting executables
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG
          $date = Get-Date -AsUTC -Format 'yyyyMMdd'
          $hash = $env:GITHUB_SHA.Substring(0, 7)
          $output = "Cheat-Engine_${version}_${date}_${hash}"
          $payload = Join-Path $env:RUNNER_TEMP 'cheat-engine-payload'
          New-Item -ItemType Directory -Force $output | Out-Null
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item "$env:PROJECT_DIR\bin\*" $payload -Recurse

          $sevenZip = (Get-Command 7z.exe -ErrorAction Stop).Source
          $sfx = Join-Path (Split-Path $sevenZip) '7z.sfx'
          if (-not (Test-Path $sfx)) { throw "7z.sfx was not found next to 7z.exe" }

          function New-Sfx($targetName, $programName) {
            $config = Join-Path $env:RUNNER_TEMP "$targetName.txt"
            $configText = ';!@Install@!UTF-8!' + "`r`n" + 'RunProgram="' + $programName + '"' + "`r`n" + ';!@InstallEnd@!' + "`r`n"
            [IO.File]::WriteAllText($config, $configText, [Text.UTF8Encoding]::new($false))
            $archive = Join-Path $env:RUNNER_TEMP "$targetName.7z"
            & $sevenZip a -t7z -mx=9 $archive "$payload\*" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "7-Zip failed for $targetName" }
            cmd.exe /c copy /b "`"$sfx`"+`"$config`"+`"$archive`"" "`"$(Join-Path $output $targetName)`"" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "SFX creation failed for $targetName" }
          }

          New-Sfx "${output}_x86.exe" 'cheatengine-i386.exe'
          New-Sfx "${output}_x64.exe" 'cheatengine-x86_64.exe'
          "PACKAGE_DIR=$output" | Out-File $env:GITHUB_ENV -Append
          "X86_FILE=$output\${output}_x86.exe" | Out-File $env:GITHUB_ENV -Append
          "X64_FILE=$output\${output}_x64.exe" | Out-File $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cheat-engine-${{ github.sha }}
          path: ${{ env.PACKAGE_DIR }}\*.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: pwsh
        run: |
          gh release create "$env:RELEASE_TAG" "$env:X86_FILE" "$env:X64_FILE" `
            --target "$env:GITHUB_SHA" `
            --title "Cheat Engine $($env:RELEASE_TAG -replace '^v', '')" `
            --generate-notes
